name: DADA VPN Android

on:
  pull_request:
    paths:
      - "android-client/**"
      - ".github/workflows/dada-vpn-android.yml"
  push:
    branches: [main]
    paths:
      - "android-client/**"
      - ".github/workflows/dada-vpn-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Fetch pinned official libXray
        run: ./scripts/fetch-libxray.sh
      - name: Unit tests and debug APK
        run: chmod +x gradlew && ./gradlew --no-daemon testDebugUnitTest assembleDebug lintDebug
