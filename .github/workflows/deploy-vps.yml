name: Deploy VPS

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'routes/**'
      - 'middleware/**'
      - 'public/**'
      - 'server.js'
      - 'package.json'
      - 'Dockerfile'
      - 'docker-compose.vps.yml'
      - 'scripts/deploy-vps.sh'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_HOST }}
        run: bash scripts/deploy-vps.sh
