# Отдельный vhost для Happ — НЕ редактировать конфиг panel777 / remnawave.
#
# На сервере 45.140.42.39:
#   1. Замените UPSTREAM_HOST на hostname run.app (без https://)
#   2. sudo cp nginx-sub.twidu.com.conf /etc/nginx/sites-available/sub.twidu.com
#   3. sudo ln -sf /etc/nginx/sites-available/sub.twidu.com /etc/nginx/sites-enabled/
#   4. sudo certbot --nginx -d sub.twidu.com
#   5. sudo nginx -t && sudo systemctl reload nginx

upstream vpn_panel_cloud_run {
    server UPSTREAM_HOST:443;
    keepalive 8;
}

server {
    listen 80;
    server_name sub.twidu.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name sub.twidu.com;

    ssl_certificate     /etc/letsencrypt/live/sub.twidu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sub.twidu.com/privkey.pem;

    location = / {
        return 404;
    }

    location ~ ^/api/sub/([A-Za-z0-9]+)$ {
        proxy_pass https://vpn_panel_cloud_run/api/sub/$1$is_args$args;
        proxy_ssl_server_name on;
        proxy_ssl_name UPSTREAM_HOST;
        proxy_http_version 1.1;
        proxy_set_header Host UPSTREAM_HOST;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        proxy_pass_request_headers on;
    }

    location ~ ^/sub/([A-Za-z0-9]+)$ {
        proxy_pass https://vpn_panel_cloud_run/sub/$1$is_args$args;
        proxy_ssl_server_name on;
        proxy_ssl_name UPSTREAM_HOST;
        proxy_http_version 1.1;
        proxy_set_header Host UPSTREAM_HOST;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        proxy_pass_request_headers on;
    }

    location / {
        return 404;
    }
}
