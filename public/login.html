<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Вход в VPN Panel</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #eef4ff;
      --card: #ffffff;
      --text: #142033;
      --muted: #64748b;
      --accent: #2563eb;
      --danger: #dc2626;
      --border: #dbe3ef;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      font-family: system-ui, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(37,99,235,.18), transparent 35%),
        linear-gradient(135deg, #f8fbff, var(--bg));
      color: var(--text);
    }
    .card {
      width: min(440px, calc(100% - 32px));
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 22px 70px rgba(15, 23, 42, .12);
    }
    h1 { margin: 0 0 8px; font-size: 26px; }
    p { margin: 0 0 20px; color: var(--muted); line-height: 1.5; }
    label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 14px;
      font-size: 15px;
    }
    button {
      width: 100%;
      padding: 12px 14px;
      border: 0;
      border-radius: 10px;
      color: #fff;
      background: var(--accent);
      font-weight: 700;
      cursor: pointer;
      font-size: 15px;
    }
    .hint { font-size: 13px; color: var(--muted); margin-top: 16px; }
    .error { display: none; color: var(--danger); margin-top: 12px; font-size: 14px; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Вход в панель</h1>
    <p>Owner: логин <b>owner</b> и пароль из настроек VPS. Дилер — свой логин и пароль.</p>

    <form id="loginForm">
      <label for="username">Логин</label>
      <input id="username" autocomplete="username" placeholder="owner или логин дилера" required autofocus />

      <label for="password">Пароль</label>
      <input id="password" type="password" autocomplete="current-password" required />

      <button id="submitBtn" type="submit">Войти</button>
      <div id="error" class="error"></div>
    </form>

    <div class="hint">Сессия хранится в защищённой httpOnly cookie. Admin Key не сохраняется в браузере.</div>
  </main>

  <script>
    const storageKey = 'vpn-panel-settings';
    const apiUrl = window.location.origin;

    function savePanelBase(extra = {}) {
      const saved = JSON.parse(localStorage.getItem(storageKey) || '{}');
      saved.apiUrl = apiUrl;
      delete saved.adminKey;
      delete saved.token;
      Object.assign(saved, extra);
      localStorage.setItem(storageKey, JSON.stringify(saved));
    }

    async function checkExistingSession() {
      try {
        const res = await fetch(`${apiUrl}/admin/auth/me`, { credentials: 'include' });
        if (res.ok) window.location.replace('/panel');
      } catch {}
    }

    document.getElementById('loginForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const error = document.getElementById('error');
      const button = document.getElementById('submitBtn');
      error.style.display = 'none';
      button.disabled = true;
      button.textContent = 'Проверка...';

      try {
        const res = await fetch(`${apiUrl}/admin/auth/login`, {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value.trim(),
            password: document.getElementById('password').value,
          }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || 'Неверный логин или пароль');
        savePanelBase();
        window.location.replace('/panel');
      } catch (err) {
        error.textContent = err.message;
        error.style.display = 'block';
      } finally {
        button.disabled = false;
        button.textContent = 'Войти';
      }
    });

    checkExistingSession();
  </script>
</body>
</html>
